<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trelo2</title><style>body{margin:0;font-family:system-ui;background:#f4f2f8;color:#202336}.top{padding:18px 28px;background:#5b3f8c;color:white;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0}.top input{padding:10px;border:0;border-radius:7px}.wrap{padding:28px;overflow:auto}.board{display:flex;gap:16px;align-items:flex-start}.col{background:#e9e6f0;border-radius:12px;padding:12px;min-width:260px}.col h2{font-size:15px}.card{background:white;border-radius:9px;padding:13px;margin:9px 0;box-shadow:0 2px 8px #0001;cursor:grab}.tag{font-size:11px;color:#6b50a0}.add,.new{border:0;background:transparent;color:#6b50a0;padding:10px;font-weight:bold}.auth{position:fixed;inset:0;background:#202331e8;display:grid;place-items:center}.box{background:white;padding:25px;border-radius:14px;width:min(360px,90%)}.box input,.box button{width:100%;padding:11px;margin:6px 0;border-radius:7px;border:1px solid #ddd}.box button{background:#5b3f8c;color:white;border:0;font-weight:bold}.off{background:white!important;color:#5b3f8c!important;border:1px solid #5b3f8c!important}.hide{display:none}</style></head><body><div id="auth" class="auth"><div class="box"><h2>Entrar no Trelo2</h2><p>Sincronize seus quadros com Supabase.</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><button onclick="signup()">Criar conta</button><button class="off" onclick="offline()">Continuar offline</button><p id="msg"></p></div></div><header class="top"><h1>Trelo2</h1><div><input id="search" placeholder="Pesquisar cartões"> <button onclick="logout()">Sair</button></div></header><main class="wrap"><div class="board" id="board"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>var url="https://prkzlfwiesfiiikifnhs.supabase.co",key="sb_publishable_lDF7Q4t8mApjzNzNkDFvVQ_9fxC_sR5",sb=window.supabase.createClient(url,key),data=JSON.parse(localStorage.trelo2||"null")||[{name:"Ideias",items:["Mapear referências","Escrever visão do produto"]},{name:"Em andamento",items:["Organizar página inicial"]},{name:"Concluído",items:[]}],drag=null;function save(){localStorage.trelo2=JSON.stringify(data)}function render(){var q=(document.getElementById("search").value||"").toLowerCase(),b=document.getElementById("board");b.innerHTML="";data.forEach(function(c,i){var e=document.createElement("section");e.className="col";e.innerHTML="<h2>"+c.name+" ("+c.items.length+")</h2><div class=cards></div><button class=add>＋ Adicionar cartão</button>";var cards=e.querySelector(".cards");e.ondragover=function(x){x.preventDefault()};e.ondrop=function(){if(drag){data[i].items.push(data[drag[0]].items.splice(drag[1],1)[0]);save();render()}};e.querySelector(".add").onclick=function(){var t=prompt("Nome do cartão");if(t){c.items.push(t);save();render()}};c.items.forEach(function(t,j){if(q&&!t.toLowerCase().includes(q))return;var x=document.createElement("article");x.className="card";x.draggable=true;x.innerHTML="<b>"+t+"</b><br><span class=tag>Planejamento</span>";x.ondragstart=function(){drag=[i,j]};x.ondblclick=function(){var n=prompt("Editar cartão",t);if(n){c.items[j]=n;save();render()}};cards.append(x)});b.append(e)});var n=document.createElement("button");n.className="new";n.textContent="＋ Nova lista";n.onclick=function(){var t=prompt("Nome da lista");if(t){data.push({name:t,items:[]});save();render()}};b.append(n)}async function login(){var r=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error)msg.textContent=r.error.message;else offline()}async function signup(){var r=await sb.auth.signUp({email:email.value,password:pass.value});msg.textContent=r.error?r.error.message:"Conta criada. Confirme seu e-mail."}function offline(){auth.classList.add("hide")}function logout(){auth.classList.remove("hide")}search.oninput=render;render();</script></body></html>
